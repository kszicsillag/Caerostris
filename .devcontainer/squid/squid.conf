# Default-deny forward proxy: only CONNECT/HTTP to hosts listed in
# allowed_domains.txt is permitted. Filters on the hostname in the CONNECT
# request itself, so this needs no ssl_bump, no TLS interception, and no CA
# cert trusted by clients - see .claude/sandbox-design.md Layer 3.

acl allowed_dst dstdomain "/etc/squid/allowed_domains.txt"

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

http_access allow CONNECT allowed_dst
http_access allow allowed_dst
http_access deny all

http_port 3128
coredump_dir /var/spool/squid
