services:
  devcontainer:
    image: mcr.microsoft.com/devcontainers/dotnet:10.0
    init: true
    user: root
    # Dev Containers replaces `command` with its own keep-alive process, so
    # ownership setup must live in the entrypoint to run before VS Code Server.
    # Docker creates the parent of the nested Playwright volume as root.
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /home/vscode/.cache/ms-playwright
        chown vscode:vscode /home/vscode/.cache /home/vscode/.cache/ms-playwright /home/vscode/.vscode-server
        exec "$@"
      - --
    # Keeps the container alive - unlike image-based devcontainers, compose
    # services have no interactive client holding the default CMD open.
    command:
      - sh
      - -c
      - |
        exec sleep infinity
    networks:
      - internal_net # no direct route to the internet - see proxy below
    depends_on:
      proxy:
        condition: service_healthy
    volumes:
      # The workspace itself. VS Code bind-mounts this automatically in
      # image-based devcontainers; compose-based ones must declare it.
      - ..:/workspaces/Caerostris:cached

      # Caerostris.csproj/Caerostris.sln reference these by relative path -
      # real bind mounts, not named volumes, since these need to be the
      # actual sibling checkouts on the host, not container-private state.
      # Requires the three repos to be cloned as true siblings of this one
      # on the host - see README's devcontainer section. Paths are relative
      # to this compose file's own directory (.devcontainer/), which Compose
      # resolves natively - NOT ${localWorkspaceFolder}: that's a devcontainer.json
      # variable that only gets substituted into compose files if the tool
      # invoking `docker compose` sets it as a real env var first, which isn't
      # reliable across Dev Containers extension versions/invocation paths -
      # when it silently defaults to blank, the mount source becomes
      # `/../CaerostrisServer` (host filesystem root), which Docker then
      # auto-creates as an empty root-owned directory instead of failing loudly.
      - ../../CaerostrisServer:/workspaces/CaerostrisServer
      - ../../SpotifyService:/workspaces/SpotifyService
      - ../../SpotifyAuthServer:/workspaces/SpotifyAuthServer

      # Named volumes, not bind mounts to host paths: state is owned by this
      # project and never leaks another project's/host's identity into this
      # container. `name:` below pins each to its pre-existing literal
      # volume name (see top-level `volumes:` block) so this migration picks
      # up already-populated volumes instead of starting fresh ones.
      - caerostris-claude-config:/home/vscode/.claude
      - caerostris-gh-config:/home/vscode/.config/gh
      - caerostris-bash-history:/commandhistory
      - caerostris-git-config:/home/vscode/.config/git
      - caerostris-nuget-cache:/home/vscode/.nuget/packages
      # VS Code Server binaries + extension cache. Without this, VS Code
      # re-downloads its server component and reinstalls every extension
      # from inside the egress cage on every single rebuild, not just the
      # first - see .claude/sandbox-design.md Layer 3. Safe to cache: a
      # client-version mismatch makes VS Code fetch the new build into this
      # same directory rather than serving a stale one.
      - caerostris-vscode-server:/home/vscode/.vscode-server
      # Playwright browser binaries (~290MB+ per revision): both the
      # run-caerostris skill's driver.cs (Microsoft.Playwright NuGet) and
      # the playwright MCP server (@playwright/mcp, via npx) download into
      # this same default cache dir - PLAYWRIGHT_BROWSERS_PATH below just
      # makes that explicit. Without this volume it's under $HOME, which
      # post-create.sh's own comments note is wiped on every rebuild, so
      # both tools would otherwise re-download their browser through the
      # egress cage every single time.
      - caerostris-playwright-browsers:/home/vscode/.cache/ms-playwright
    environment:
      # Container-wide, so every process (bash, dotnet, npm, the VS Code
      # extension host, a headless browser) is proxied, not just commands
      # VS Code itself launches.
      HTTP_PROXY: http://proxy:3128
      HTTPS_PROXY: http://proxy:3128
      http_proxy: http://proxy:3128
      https_proxy: http://proxy:3128
      NO_PROXY: localhost,127.0.0.1,::1
      no_proxy: localhost,127.0.0.1,::1

      # Consolidates Claude Code's config into the mounted volume above
      # instead of scattering stray dotfiles elsewhere under $HOME.
      CLAUDE_CONFIG_DIR: /home/vscode/.claude
      # Bash only flushes history to disk on clean exit; editors/terminals
      # routinely kill the shell instead. HISTFILE + PROMPT_COMMAND together
      # make every command durable immediately.
      HISTFILE: /commandhistory/.bash_history
      PROMPT_COMMAND: history -a
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      # Pins both Playwright consumers (driver.cs, the playwright MCP
      # server) at the volume-backed cache mounted above instead of relying
      # on it matching their own default.
      PLAYWRIGHT_BROWSERS_PATH: /home/vscode/.cache/ms-playwright
      # Points git's --global scope at the volume-backed file above instead
      # of the ephemeral ~/.gitconfig, so identity/credential-helper config
      # survives container rebuilds.
      GIT_CONFIG_GLOBAL: /home/vscode/.config/git/config

      # Shrinks the required egress allowlist: no update checks and no
      # Datadog telemetry intake hosts to allow through the cage. The
      # devcontainer Feature reinstalls Claude Code fresh on every rebuild
      # anyway, so pinning mid-session is the right call here.
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"

  proxy:
    # Canonical doesn't publish a numbered "_stable" tag for this image, only
    # _edge/_beta channel tags. Re-pin by digest after first pull:
    #   docker inspect --format='{{index .RepoDigests 0}}' <image>
    image: ubuntu/squid:6.6-24.04_edge
    networks:
      - internal_net # reachable by the caged devcontainer
      - egress # ...and can reach the internet - the sole bridge between them
    volumes:
      - ./squid/squid.conf:/etc/squid/squid.conf:ro
      - ./squid/allowed_domains.txt:/etc/squid/allowed_domains.txt:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/3128"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 10s

networks:
  internal_net:
    internal: true
  egress:
    driver: bridge

volumes:
  caerostris-claude-config:
    name: caerostris-claude-config
  caerostris-gh-config:
    name: caerostris-gh-config
  caerostris-bash-history:
    name: caerostris-bash-history
  caerostris-git-config:
    name: caerostris-git-config
  caerostris-nuget-cache:
    name: caerostris-nuget-cache
  caerostris-vscode-server:
    name: caerostris-vscode-server
  caerostris-playwright-browsers:
    name: caerostris-playwright-browsers
